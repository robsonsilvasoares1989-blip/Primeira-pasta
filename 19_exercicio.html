<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <h1>Titulo</h1> 
 <input type="text" name="campo" id="">

 </script>
