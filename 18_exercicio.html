<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Troca de Valores</title>
</head>
<body>

    <h2>Troca de Valores</h2>

    <script>
        let a = 10;
        let b = 20;

        let temporaria = a;
        a = b;
        b = temporaria;

        document.write("Valor de A: " + a + "<br>");
        document.write("Valor de B: " + b);
    </script>

</body>
</html>
