<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nota</title>
</head>

<body>
    <p>Digite uma nota(0 a 10): </p>
    <input type="number" name="" id="caixa" min="0" max="10">
    <p id="resultado"></p>
    <script>
        let caixa = document.querySelector("#caixa")
        let resultado = document.querySelector("#resultado")
        caixa.addEventListener("change", function () {
            if (this.value >= 7) {
                resultado.textContent = this.value + 'aprovado'
            }
            else if (this.value >=5 && this.value< 7) {
                resultado.textContent = this.value + ' em recuperação'
            }
            else {
                resultado.textContent = ' reprovado'
            }
        })
    </script>
</body>

</html>
