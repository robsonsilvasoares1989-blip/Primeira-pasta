<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Múltiplos</title>
</head>
<body>

    <p>Digite um número inteiro:</p>
    <input type="number" id="numero">
    <button onclick="verificar()">Verificar</button>
    <p id="resultado"></p>
    <script>
        function verificar() {
            let numero = Number(document.getElementById("numero").value);
            if (numero == "") {
                document.getElementById("resultado").innerHTML =
                "Digite um número.";
            }     
            else if (numero % 3 == 0 && numero % 5 == 0) {
                document.getElementById("resultado").innerHTML =
                "O número " + numero +
                " é múltiplo de 3 e de 5 ao mesmo tempo.";
            }            
            else if (numero % 3 == 0) {
                document.getElementById("resultado").innerHTML =
                "O número " + numero +
                " é múltiplo de 3, mas não é múltiplo de 5.";
            }    
            else if (numero % 5 == 0) {
                document.getElementById("resultado").innerHTML =
                "O número " + numero +
                " é múltiplo de 5, mas não é múltiplo de 3.";
            }        
            else {

                document.getElementById("resultado").innerHTML =
                "O número " + numero +
                " não é múltiplo de 3 nem de 5.";

            }
        }

    </script>

</body>
</html>
