```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Conversor de Temperatura</title>
</head>
<body>

    <h1>Fahrenheit para Celsius</h1>

    <input type="number" id="f" placeholder="Digite Fahrenheit">
    <button onclick="converter()">Converter</button>

    <p id="resultado"></p>

    <script>
        function converter() {
            let f = document.getElementById("f").value;

            if (f === "") {
                document.getElementById("resultado").innerHTML =
                    "Digite uma temperatura!";
                return;
            }

            let c = (Number(f) - 32) * 5 / 9;

            document.getElementById("resultado").innerHTML =
                "Temperatura em Celsius: " + c.toFixed(2) + " °C";
        }
    </script>

</body>
</html>
```
