<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
</head>
<body>
    <p>Digite seu peso em quilos:</p>
    <input type="number" id="peso">
    <p>Digite sua altura em metros:</p>
    <input type="number" id="altura">
    <br><br>
    <button onclick="calcular()">Calcular IMC</button>
    <p id="resultado"></p>
    <script>
        function calcular() {
            let peso = Number(document.getElementById("peso").value);
            let altura = Number(document.getElementById("altura").value);
            let imc = peso / (altura * altura);
            if (imc < 18.5) {
                document.getElementById("resultado").innerHTML =
                "Seu IMC é: " + imc.toFixed(2) +
                "<br>Classificação: Abaixo do peso.";
            }
            else if (imc >= 18.5 && imc < 25) {
                document.getElementById("resultado").innerHTML =
                "Seu IMC é: " + imc.toFixed(2) +
                "<br>Classificação: Peso ideal.";
            }
            else if (imc >= 25 && imc < 30) {
                document.getElementById("resultado").innerHTML =
                "Seu IMC é: " + imc.toFixed(2) +
                "<br>Classificação: Acima do peso.";
            }
            else {
                document.getElementById("resultado").innerHTML =
                "Seu IMC é: " + imc.toFixed(2) +
                "<br>Classificação: Obesidade.";
            }
        }
    </script>

</body>
</html>
