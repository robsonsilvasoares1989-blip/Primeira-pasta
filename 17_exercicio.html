<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Variáveis</title>
</head>
<body>

    <script>
        let texto = "Olá, mundo!";
        let numero = 25;

        document.write("Valor da variável texto: " + texto + "<br>");
        document.write("Tipo: " + typeof texto + "<br><br>");

        document.write("Valor da variável numero: " + numero + "<br>");
        document.write("Tipo: " + typeof numero);
    </script>

</body>
</html>
